server:
  port: 8086

spring:
  application:
    name: enrollment-service

  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:distrischool_db}?currentSchema=enrollment_schema
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: enrollment_schema
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: enrollment_schema
    default-schema: enrollment_schema
    baseline-on-migrate: true
    locations: classpath:db/migration

services:
  aluno:
    url: http://${ALUNO_SERVICE_HOST:aluno-service}:${ALUNO_SERVICE_PORT:8082}
  class:
    url: http://${CLASS_SERVICE_HOST:class-service}:${CLASS_SERVICE_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
