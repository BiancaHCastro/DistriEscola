server:
  port: 8085

spring:
  application:
    name: class-service

  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:distrischool_db}?currentSchema=class_schema
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: class_schema
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: class_schema
    default-schema: class_schema
    baseline-on-migrate: true
    locations: classpath:db/migration

services:
  teacher:
    url: http://${TEACHER_SERVICE_HOST:teacher-service}:${TEACHER_SERVICE_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
